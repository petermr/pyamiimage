[tool:pytest]
# Configure pytest for headless operation
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --tb=short
    --strict-markers
    --disable-warnings
    -v

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests as requiring network access
    gui: marks tests that might open GUI windows
    headless: marks tests that should run in headless mode
    ocr: marks tests that use OCR functionality
    image: marks tests that process images

# Environment variables for headless operation
env =
    DISPLAY = :99
    MPLBACKEND = Agg

